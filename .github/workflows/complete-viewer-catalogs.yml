name: Complete Viewer Catalogs

permissions:
  contents: write

on:
  push:
    branches: [sunrise-viewer]
  workflow_dispatch:

jobs:
  complete:
    name: Generate, compile, and publish runtime adapters
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[viewer-catalogs]') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Checkout latest Viewer branch
        uses: actions/checkout@v4
        with:
          ref: sunrise-viewer
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate, compile, and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "Viewer catalog completion attempt $attempt"
            git fetch --no-tags origin sunrise-viewer sunrise-inspector
            git reset --hard origin/sunrise-viewer
            git clean -fd

            python tools/complete_viewer_inspection.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/generate_viewer_catalog_adapters.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tools/finalize_generated_viewer_adapters.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git diff --check origin/sunrise-inspector...HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git diff --check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            msbuild Sunrise.sln /m /p:Configuration=Release /p:Platform=x64 /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $changes = git status --porcelain
            if (-not $changes) {
              Write-Host "Viewer runtime adapters are already current."
              exit 0
            }

            git add README.md `
              Sunrise/src/client/inspection/providers/spawn_inspection_provider.h `
              Sunrise/src/client/inspection/providers/spawn_inspection_provider.cpp `
              Sunrise/src/client/inspection/providers/generated_runtime_catalog_adapters.h `
              Sunrise/src/client/ui/world_inspector/world_inspector_viewport.cpp
            git commit -m "Complete Viewer runtime catalogs [skip ci] [viewer-catalogs]"

            git fetch --no-tags origin sunrise-viewer
            git merge-base --is-ancestor origin/sunrise-viewer HEAD
            if ($LASTEXITCODE -eq 0) {
              git push origin HEAD:refs/heads/sunrise-viewer
              if ($LASTEXITCODE -eq 0) {
                exit 0
              }
            }

            Write-Host "The branch advanced while compiling; regenerating against the latest head."
          }

          throw "Unable to publish Viewer runtime adapters after four non-forced retries."

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Viewer-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error
