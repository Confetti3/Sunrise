name: Clean Viewer Temporary Branches

permissions:
  contents: write

on:
  push:
    branches: [sunrise-viewer]
  workflow_dispatch:

jobs:
  cleanup:
    name: Remove abandoned completion branches
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete exact temporary refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          branches=(
            'agent/remaining-inspection-features'
            'sunrise-viewer-runtime-gap-work'
            'sunrise-viewer-completion'
            'sunrise-viewer-inspection-runtime'
            'sunrise-viewer-finalization'
            'sunrise-viewer-complete-runtime-inspection'
            'sunrise-viewer-runtime-context'
            'sunrise-viewer-live-context'
          )
          for branch in "${branches[@]}"; do
            echo "Removing temporary ref: $branch"
            gh api --method DELETE "/repos/$REPOSITORY/git/refs/heads/$branch" --silent || true
          done
