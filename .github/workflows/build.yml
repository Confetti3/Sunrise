name: Build

permissions:
  contents: write

on:
  push:
    branches: [master, sunrise-inspector, sunrise-viewer]
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Release x64
    # The image carries Visual Studio 2026, so the project's own v145 toolset and its
    # 10.0.26100.0 SDK are both present. No toolset override.
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Complete Viewer inspection adapters
        if: github.ref == 'refs/heads/sunrise-viewer' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: python tools/complete_viewer_inspection.py

      - name: Verify Viewer diff hygiene
        shell: pwsh
        run: |
          git fetch --no-tags origin sunrise-inspector:refs/remotes/origin/sunrise-inspector
          git diff --check origin/sunrise-inspector...HEAD
          git diff --check

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: >
          msbuild Sunrise.sln /m
          /p:Configuration=Release
          /p:Platform=x64
          /verbosity:minimal

      - name: Commit verified Viewer adapters
        if: github.ref == 'refs/heads/sunrise-viewer' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md `
              Sunrise/src/client/inspection/providers/spawn_inspection_provider.h `
              Sunrise/src/client/inspection/providers/spawn_inspection_provider.cpp `
              Sunrise/src/client/ui/world_inspector/world_inspector_viewport.cpp
            git commit -m "Complete Viewer runtime inspection adapters [skip ci]"
            git push origin HEAD:refs/heads/sunrise-viewer
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sunrise-Release-x64
          path: |
            build/x64/Release/steam_api64.dll
            build/x64/Release/steam_api64.pdb
          if-no-files-found: error
