name: Script host

on:
  pull_request:
    paths:
      - 'ScriptHost/**'
      - 'Sunrise/src/server/script_host/**'
      - 'Sunrise/src/server/runtime/server_runtime.cpp'
      - '.github/workflows/script-host.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-host:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build .\ScriptHost\Sunrise.ScriptHost.csproj --configuration Release --nologo
      - name: Run deterministic self-test
        run: >-
          dotnet run --project .\ScriptHost\Sunrise.ScriptHost.csproj
          --configuration Release --no-build -- --self-test
      - name: Validate included prototype
        run: >-
          dotnet run --project .\ScriptHost\Sunrise.ScriptHost.csproj
          --configuration Release --no-build --
          --validate
          --scenario .\ScriptHost\scripts\red-war-first-mission.prototype.json
          --binding .\ScriptHost\bindings\build-86657.json
