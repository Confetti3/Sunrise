name: GPT-5.6 Inspector implementation

permissions:
  contents: write

on:
  push:
    branches:
      - gpt56/sunrise-inspector-usability

jobs:
  implement:
    name: Apply Inspector improvements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize implementation script
        shell: bash
        run: |
          mkdir -p tools
          cat .github/gpt56/payload.part* \
            | tr -d '\n' \
            | base64 --decode \
            | gzip --decompress \
            > tools/gpt56_apply_inspector_improvements.py

      - name: Apply implementation
        run: python tools/gpt56_apply_inspector_improvements.py

      - name: Remove staged payload
        run: rm -rf .github/gpt56

      - name: Verify patch hygiene
        run: git diff --check

      - name: Run Python catalog tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Inspector browsing, graph density, and relationships"
          git push origin HEAD:gpt56/sunrise-inspector-usability
